radius_bottom_right = 0
radius_top_right = 0
scale = 1.2500000111758709
start = [ "clock", "widget", "group:g1", "bar" ]
widget_spacing = 15

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "caffeine", "notifications", "power_profile" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "bluetooth", "network" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "cb_lock", "session" ]
    opacity = 1.0
    padding = 6.0

