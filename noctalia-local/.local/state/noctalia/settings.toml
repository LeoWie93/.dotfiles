[bar.default]
capsule_radius = 5
center = [ "media", "workspaces", "privacy" ]
concave_edge_corners = false
end = [ "tray", "group:g2", "volume", "brightness", "battery", "group:g3" ]
font_weight = 400
margin_ends = 0
radius = 0
