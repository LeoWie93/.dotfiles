[osd.kinds]
caffeine = false
dnd = false
media = false

[plugins]
enabled = [ "profidev/hypr-screen-mirror", "noctalia/timer" ]

[shell]
clipboard_enabled = false
font_family = "Atkinson Hyperlegible"
telemetry_enabled = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true

    [shell.screenshot]
    save_to_file = false

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        command = "systemctl suspend-then-hybernate"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        command = "hyprshutdown -p \"shutdown now\""
        countdown_seconds = 2.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Kanagawa Kasumi"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "hyprland", "qt" ]

[wallpaper]
transition = [ "wipe" ]

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/lwi/Pictures/Wallpapers/Bellotto-Bernardo_View-of-Pirna-from-the-Sonnenstein-Castle.jpg"

    [wallpaper.last]
    path = "/home/lwi/Pictures/Wallpapers/Bellotto-Bernardo_View-of-Pirna-from-the-Sonnenstein-Castle.jpg"

    [wallpaper.monitors.DP-5]
    path = "/home/lwi/Pictures/Wallpapers/green-nature-girl-anime.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lwi/Pictures/Wallpapers/Bellotto-Bernardo_View-of-Pirna-from-the-Sonnenstein-Castle.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "/home/lwi/Pictures/Wallpapers/blue-fish-anime-girl-flowers-dark-hair.jpg"
    theme_mode = "dark"

[weather]
effects = false

[widget.bar]
type = "noctalia/timer:bar"

[widget.cb_lock]
glyph = "lock"
type = "custom_button"

    [widget.cb_lock.actions]
    left = "exec hyprlock"
    scroll_down = "none"
    scroll_up = "none"

[widget.clock]
format = "{:%a, %d.%m - %H:%M}"

[widget.media]
hide_when_no_media = true

[widget.privacy]
hide_inactive = true

[widget.widget]
type = "profidev/hypr-screen-mirror:widget"

[widget.workspaces]
active_pill_size = 1.0
anchor = true
capsule_radius = 1
focused_color = "secondary"
font_weight = 700
occupied_color = "on_primary"
scale = 1.25